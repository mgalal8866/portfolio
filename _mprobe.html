<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:#000;overflow:hidden}iframe{border:0;width:100vw;height:100vh;display:block}#out{position:fixed;left:0;bottom:0;max-width:100vw;font:10px monospace;color:#ff0;background:rgba(0,0,0,.8);white-space:pre-wrap;z-index:9;display:none}</style></head>
<body><iframe id="f"></iframe><pre id="out"></pre>
<script>
const q = new URLSearchParams(location.search), f = document.getElementById('f');
f.src = '/?lang=' + (q.get('lang') || 'en');
f.onload = () => setTimeout(() => {
  const w = f.contentWindow, d = w.document, s = q.get('s');
  const target = s === 'bottom' ? d.documentElement.scrollHeight : (s ? d.getElementById(s).getBoundingClientRect().top + w.scrollY - 60 : 0);
  if (w.lenis) w.lenis.scrollTo(target, { immediate: true }); else w.scrollTo(0, target);
  w.scrollTo(0, target);
  setTimeout(() => {
    const vw = d.documentElement.clientWidth, bad = [];
    d.querySelectorAll('body *').forEach(el => {
      const r = el.getBoundingClientRect(); if (!r.width) return;
      if (el.closest('.marquee,.skills__sphere,canvas,.noise,.cursor,.cursor-dot,.nav__links')) return;
      if (r.right > vw + 1 || r.left < -1) bad.push((el.id ? '#' + el.id : el.className || el.tagName) + ' [' + Math.round(r.left) + '..' + Math.round(r.right) + ']');
    });
    const o = document.getElementById('out');
    o.textContent = JSON.stringify({ vw, docW: d.documentElement.scrollWidth, bodyW: d.body.scrollWidth, overflow: [...new Set(bad)].slice(0, 15) });
  }, 3500);
}, 7000);
</script></body></html>
